<!DOCTYPE html>
<html>
<head>
    <title>Two Images</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        .image-block {
            background-color: lightblue;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

            .image-block img {
                width: 200px;
                height: 250px;
                object-fit: cover;
                margin: 10px;
                border-radius: 10px;
            }
            .image-lock img {
                width: 390px;
                height: 250px;
                object-fit: cover;
                margin: 10px;
                border-radius: 10px;
            }
    </style>
</head>

<body background-color:block>

    <div class="image-lock" >


        <img src="1000121944.jpg" alt="Image 1"><br>

    </div>

    <div class="image-block">

        

        <img src="1000121946.jpg" alt="Image 2">

    </div>

</body>
</html>
